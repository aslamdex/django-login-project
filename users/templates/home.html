{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css'%}">




</head>

<body>

    <!-- ...................bubbles.................. -->

    <div class="bubbles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <div class="login-container">

        <div class="login-card">

            <!-------------image------------------------->

            <div class="avatar">
                <img src="{% static 'image/image-2.png' %}" alt="avatar">
            </div>

            <!-----------------heading------------------->

            <h1>Student Login</h1>
            <p>Welcome Back</p>

            <!---------------------result show---------------------->

            <div id="message"></div>


            <!--------------------------form validation---------------------------->

            <form method="post">
                {% csrf_token %}

                <!-- .........................input top........................ -->

                <div class="form-input">

                    <label>Username</label>

                    <div class="input-box">

                        <input type="text" name="username" placeholder="enter your username" required id="username">

                        <i class="bi bi-person-fill"></i>

                    </div>



                </div>

                <!-- ............................input button............................... -->

                <div class="form-input">

                    <label>Password</label>


                    <div class="input-box">

                        <input type="password" name="password" placeholder="enter your password" required id="password">

                        <i class="bi bi-eye-fill"></i>

                    </div>


                </div>



                <button type="button" onclick="validateForm()">Login</button>

            </form>




        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
